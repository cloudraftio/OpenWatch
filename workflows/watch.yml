name: watch

on:
  schedule:
    - cron: "0 6 * * *"  # Daily 06:00 UTC.
  workflow_dispatch: {}

permissions:
  contents: write  # To commit the updated database and reports back.

# A manual run overlapping the scheduled one would have both commit and race to push.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Space-separated list of repos to watch. One database holds all of them, so
      # adding a repo here is the only step needed to start tracking it.
      WATCH_REPOS: ${{ vars.WATCH_REPOS || vars.WATCH_REPO || 'prometheus/prometheus' }}
      # Where state lives. Unset means the default openwatch.duckdb, committed back
      # after each run. Set it to "md:openwatch" (plus a MOTHERDUCK_TOKEN secret) to
      # keep state in MotherDuck instead, and nothing is committed.
      OPENWATCH_DUCKDB: ${{ vars.OPENWATCH_DUCKDB }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      # Add SLACK_WEBHOOK_URL / SMTP_* here once those notifier stubs are implemented.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .

      - name: Watch each repo
        # Sequential, not a job matrix: DuckDB takes one writer at a time, and parallel
        # jobs would each try to commit their own version of the database back.
        run: |
          for repo in $WATCH_REPOS; do
            echo "::group::$repo"
            openwatch --repo "$repo" run
            echo "::endgroup::"
          done

      - name: Build client exposure reports
        run: |
          mkdir -p reports
          for repo in $WATCH_REPOS; do
            slug="${repo//\//-}"
            # A repo with no clients recorded yet exits non-zero; that is not a failure,
            # it just means there is no fleet to report on for that project.
            if openwatch --repo "$repo" report -o "reports/$slug.md"; then
              {
                echo "<details><summary>$repo</summary>"
                echo
                cat "reports/$slug.md"
                echo
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No clients recorded for $repo - skipping its report." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Persist state and reports
        # MotherDuck keeps its own state, but the reports are still worth committing.
        run: |
          db="${OPENWATCH_DUCKDB:-openwatch.duckdb}"
          # -f because .gitignore covers *.duckdb; only the database CI owns is committed.
          if [ "${db#md:}" = "$db" ] && [ -f "$db" ]; then
            git add -f "$db"
          fi
          git add reports
          # --porcelain, not "git diff --quiet": these files are untracked on the very
          # first run, and git diff reports untracked files as no change at all.
          if [ -n "$(git status --porcelain -- reports ${db#md:})" ]; then
            git config user.name "release-watcher-bot"
            git config user.email "actions@github.com"
            git commit -m "chore: update watcher state and reports [skip ci]"
            git push
          fi
