[project]
name = "openwatch"
version = "0.1.0"
description = "Tracks any open-source GitHub repo's releases, security advisories, CVEs, and LTS lifecycle, and broadcasts a digest to configured notification channels."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.0",  # The default storage backend.
]

[project.optional-dependencies]
sheets = [
    "gspread>=5.12",
    "google-auth>=2.23",
]

[project.scripts]
openwatch = "openwatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
